const I18nCtx = React.createContext(null);
const useI18n = () => React.useContext(I18nCtx);

function makeI18n(lang) {
  const look = (l, k) => (window.I18N_LOOKUP ? window.I18N_LOOKUP(l, k) : undefined);

  const t = (key, vars) => {
    let k = key;
    if (vars && typeof vars.count === "number") {
      let cat = "other";
      try { cat = new Intl.PluralRules(lang).select(vars.count); } catch (e) {}
      if (look(lang, `${key}_${cat}`) !== undefined || look("en", `${key}_${cat}`) !== undefined) k = `${key}_${cat}`;
    }
    let s = look(lang, k);
    if (s === undefined) s = look("en", k);
    if (s === undefined) return window.I18N_DEBUG ? `⟦${k}⟧` : k;
    if (vars) for (const [n, v] of Object.entries(vars)) s = String(s).replace(new RegExp(`\\{${n}\\}`, "g"), v);
    return s;
  };

  // valeurs métier déjà canonisées en anglais par les parsers
  const tEnum = (ns, value) => {
    if (value === undefined || value === null || value === "" || value === "—") return "—";
    const k = `enum.${ns}.${value}`;
    const s = look(lang, k) !== undefined ? look(lang, k) : look("en", k);
    return s === undefined ? String(value) : s;
  };

  return { lang, t, tEnum };
}

// Normalisation — clé insensible à la casse, aux accents,

  .replace(/[\u2018\u2019\u02BC`´]/g, "'")
  .toLowerCase()
  .replace(/[^a-z0-9]+/g, '');

// index pré-calculé : keyish(valeur) → valeur canonique
const ENUM_IDX = Object.fromEntries(
  Object.entries(ENUM_MAP).map(([ns, m]) => [
    ns,
    Object.fromEntries(Object.entries(m).map(([k, v]) => [keyish(k), v])),
  ])
);

// E('severity', 'Élevée') → 'High' ; valeur inconnue → renvoyée telle quelle (et visible comme « non classé »)
const E = (ns, value) => {
  if (value === undefined || value === null) return null;
  const raw = String(value).trim();
  if (!raw) return null;
  const hit = ENUM_IDX[ns] && ENUM_IDX[ns][keyish(raw)];
  return hit !== undefined ? hit : raw;
};

async function fetchNotionData(sourceKey) {
  const res = await fetch("/api/data", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: sourceKey }),
  });
  const json = await res.json();
  if (!json.data) throw new Error(json.error || "__NO_DATA__");
  return json;
}

// nf : cherche une colonne par n'importe lequel de ses alias, en ignorant
// casse / accents / apostrophes / ponctuation / espaces
const NF_INDEX = new WeakMap();
function nf(obj, ...keys) {
  if (!obj || typeof obj !== "object") return null;
  let idx = NF_INDEX.get(obj);
  if (!idx) {
    idx = {};
    for (const k of Object.keys(obj)) idx[keyish(k)] = obj[k];
    NF_INDEX.set(obj, idx);
  }
  for (const k of keys) {
    const v = idx[keyish(k)];
    if (v !== undefined && v !== null && v !== "") return v;
  }
  return null;
}

function parseRelIds(val) {
  if (!val) return new Set();
  const values = Array.isArray(val) ? val : [val];
  return new Set(values.flatMap(item => {
    if (!item) return [];
    if (typeof item === 'object' && item.id) return [String(item.id).replace(/-/g,"")];
    const text = String(item).trim();
    if (!text) return [];
    return text.split(",").map(s => {
      s = s.trim();
      if (s.includes("notion.so/")) { const p = s.split("/"); s = p[p.length-1].split("?")[0]; }
      return s.replace(/-/g,"");
    }).filter(Boolean);
  }));
}

                  : s>=4?{labelKey:'niu_label_building_value',color:COLORS.orange}

const NIUBar = ({score}) => {

function PieChart({ data }) {
  const {t} = useI18n();
  const total = data.reduce((s,d)=>s+d.value,0);
  if (!total) return <div style={{color:COLORS.light,fontSize:13,textAlign:"center",padding:20}}>{t('no_chart_data')}</div>;
  const size=160, cx=size/2, cy=size/2, r=64, ir=36;
  let angle=-Math.PI/2;
  const slices = data.map(d => {
    const sweep=(d.value/total)*2*Math.PI;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    angle+=sweep;
    const x2=cx+r*Math.cos(angle),y2=cy+r*Math.sin(angle);
    const ix1=cx+ir*Math.cos(angle-sweep),iy1=cy+ir*Math.sin(angle-sweep);
    const ix2=cx+ir*Math.cos(angle),iy2=cy+ir*Math.sin(angle);
    const large=sweep>Math.PI?1:0;
    return {...d,path:`M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${ix2} ${iy2} A ${ir} ${ir} 0 ${large} 0 ${ix1} ${iy1} Z`,pct:Math.round((d.value/total)*100)};
  });
  return (
    <div style={{display:"flex",alignItems:"center",gap:28,flexWrap:"wrap"}}>
      <svg width={size} height={size} style={{flexShrink:0}}>
        {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} stroke={COLORS.surface} strokeWidth={2}/>)}
        <text x={cx} y={cy-6} textAnchor="middle" fontSize={13} fontWeight={700} fill={COLORS.dark}>{total.toFixed(1)}</text>
        <text x={cx} y={cy+10} textAnchor="middle" fontSize={9} fill={COLORS.light}>{t('niu_total')}</text>
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:8,flex:1,minWidth:160}}>
        {slices.map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:s.color,flexShrink:0}}/>
            <div style={{flex:1,fontSize:12,color:COLORS.mid}}>{s.label}</div>
            <div style={{fontSize:12,fontWeight:700,color:s.color,minWidth:32,textAlign:"right"}}>{s.value.toFixed(1)}</div>
            <div style={{fontSize:11,color:COLORS.light,minWidth:34,textAlign:"right"}}>{s.pct}%</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ValueHeatmap({ values }) {
  const {t,tEnum} = useI18n();
  return (
    <div style={{overflowX:"auto"}}>
      <div style={{display:"grid",gridTemplateColumns:"80px repeat(4,1fr)",gap:8,marginBottom:8,paddingLeft:4}}>
        <div/>
        {NIU_COLS.map((col,i)=>(
          <div key={col.labelKey} style={{textAlign:"center",padding:"6px 8px",borderRadius:6,background:SCALE.niu[i].bg,border:`1px solid ${SCALE.niu[i].border}`}}>
            <div style={{fontSize:12,fontWeight:700,color:SCALE.niu[i].color}}>{t(col.labelKey)}</div>
            <div style={{fontSize:10,color:SCALE.niu[i].color,opacity:0.7}}>NIU {col.range}</div>
          </div>
        ))}
      </div>
      {CONF_ROWS.map(conf=>{
        const rowValues=values.filter(v=>v.confidence===conf);
        if(rowValues.length===0) return null;
        return (
          <div key={conf} style={{display:"grid",gridTemplateColumns:"80px repeat(4,1fr)",gap:8,marginBottom:8,alignItems:"start"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"8px 4px",borderRadius:6,background:conf==="High"?COLORS.lightGreen:conf==="Medium"?COLORS.lightYellow:COLORS.lightRed,border:`1px solid ${conf==="High"?COLORS.borderGreen:conf==="Medium"?COLORS.borderYellow:COLORS.borderRed}`,minHeight:60}}>
              <span style={{fontSize:11,fontWeight:700,color:conf==="High"?COLORS.green:conf==="Medium"?COLORS.yellow:COLORS.red,writingMode:"vertical-rl",transform:"rotate(180deg)",letterSpacing:0.5}}>
                {t('confidence_level_label',{level:tEnum('confidence',conf)})}
              </span>
            </div>
            {NIU_COLS.map((col,ci)=>{
              const cards=rowValues.filter(v=>v.niu>=col.min&&v.niu<=col.max);
              return (
                <div key={col.labelKey} style={{background:cards.length?SCALE.niu[ci].cell:COLORS.lightGray,border:`1px dashed ${cards.length?SCALE.niu[ci].border:COLORS.borderGray}`,borderRadius:8,padding:cards.length?8:0,minHeight:60,display:"flex",flexDirection:"column",gap:8}}>
                  {cards.length===0
                    ?<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:60,color:COLORS.borderGray,fontSize:18}}>—</div>
                    :cards.map(v=><ValueCard key={v.id} v={v}/>)
                  }
                </div>
              );
            })}
          </div>
        );
      })}
      {(()=>{
        const unclassified=values.filter(v=>!CONF_ROWS.includes(v.confidence));
        if(!unclassified.length) return null;
        return (
          <div style={{marginTop:12}}>
            <div style={{fontSize:11,fontWeight:700,color:COLORS.light,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>— {t('confidence_unset')}</div>

              {unclassified.map(v=><div key={v.id} style={{width:220}}><ValueCard v={v}/></div>)}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

        const IMPACT_STYLE = {
          Time:    { color:COLORS.blue,   bg:COLORS.lightBlue,   border:COLORS.borderBlue   },
          Risk:    { color:COLORS.orange, bg:COLORS.lightOrange, border:COLORS.borderOrange },
          Quality: { color:COLORS.green,  bg:COLORS.lightGreen,  border:COLORS.borderGreen  },
        };
        const wasteKeys = new Set(WASTE_COLS.map(c=>c.key));

        const FrictionCard = ({f}) => (
          <div style={{background:COLORS.surface,border:`1.5px solid ${SEV_STYLE[f.severity]?.border||COLORS.borderGray}`,borderRadius:8,padding:"10px 12px",display:"flex",flexDirection:"column",gap:5,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:4}}>
              <span style={{fontSize:10,fontWeight:700,color:COLORS.light,letterSpacing:0.5}}>{f.id}</span>
              <StatusBadge value={f.status}/>
            </div>
            <div style={{fontSize:12,fontWeight:700,color:COLORS.dark,lineHeight:1.3}}>{titleOf(f)}</div>
            {f.impact&&f.impact!=="—"&&(()=>{const s=IMPACT_STYLE[f.impact]||{color:COLORS.gray,bg:COLORS.lightGray,border:COLORS.borderGray};return <Badge text={tEnum('impact',f.impact)} color={s.color} bg={s.bg} border={s.border}/>;})()}
            {f.symptom&&<div style={{fontSize:11,color:COLORS.gray,fontStyle:"italic",marginTop:2,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{f.symptom}</div>}
          </div>
        );

        const grid = "72px repeat(4,1fr)";

        return <div>
          <SectionHeader emoji="🔥" title={t('section_frictions_title')} subtitle={t('section_frictions_subtitle')}/>

          <Card style={{marginBottom:20,padding:"12px 20px"}}>
            <div style={{display:"flex",gap:20,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:11,fontWeight:700,color:COLORS.light,textTransform:"uppercase",letterSpacing:0.5}}>{t('impact_legend')}</span>
              {Object.entries(IMPACT_STYLE).map(([k,s])=>(
                <div key={k} style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{width:10,height:10,borderRadius:2,background:s.color}}/>
                  <span style={{fontSize:12,color:COLORS.dark}}>{tEnum('impact',k)}</span>
                </div>
              ))}
            </div>
          </Card>

          <Card>
            <div style={{overflowX:"auto"}}>
              <div style={{display:"grid",gridTemplateColumns:grid,gap:8,marginBottom:8}}>
                <div/>
                {WASTE_COLS.map(col=>(
                  <div key={col.key} style={{textAlign:"center",padding:"6px 8px",borderRadius:6,background:col.bg,border:`1px solid ${col.border}`}}>
                    <div style={{fontSize:11,fontWeight:700,color:col.color}}>{tEnum('waste',col.key)}</div>
                  </div>
                ))}
              </div>

              {SEV_ROWS.map(sev=>{
                const rowFrictions=frictions.filter(f=>f.severity===sev);
                if(!rowFrictions.length) return null;
                const s=SEV_STYLE[sev];
                return (
                  <div key={sev} style={{display:"grid",gridTemplateColumns:grid,gap:8,marginBottom:8,alignItems:"start"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"8px 4px",borderRadius:6,background:s.bg,border:`1px solid ${s.border}`,minHeight:60}}>
                      <span style={{fontSize:11,fontWeight:700,color:s.color,writingMode:"vertical-rl",transform:"rotate(180deg)",letterSpacing:0.5}}>{tEnum('severity',sev)}</span>
                    </div>
                    {WASTE_COLS.map(col=>{
                      const cards=rowFrictions.filter(f=>f.wasteType===col.key);
                      return (
                        <div key={col.key} style={{background:cards.length?col.bg:COLORS.lightGray,border:`1px dashed ${cards.length?col.border:COLORS.borderGray}`,borderRadius:8,padding:cards.length?8:0,minHeight:60,display:"flex",flexDirection:"column",gap:8}}>
                          {cards.length===0
                            ?<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:60,color:COLORS.borderGray,fontSize:18}}>—</div>
                            :cards.map(f=><FrictionCard key={f.id} f={f}/>)
                          }
                        </div>
                      );
                    })}
                  </div>
                );
              })}

              {(()=>{
                const u=frictions.filter(f=>!SEV_ROWS.includes(f.severity)||!wasteKeys.has(f.wasteType));
                if(!u.length) return null;
                return <div style={{marginTop:12}}>
                  <div style={{fontSize:11,fontWeight:700,color:COLORS.light,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>— {t('unclassified')}</div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{u.map(f=><div key={f.id} style={{width:220}}><FrictionCard f={f}/></div>)}</div>
                </div>;
              })()}
            </div>
          </Card>
        </div>;
      })()}

      {/* ══ HABITS ══ */}
      {active==="Habits" && <div>
        <SectionHeader emoji="🔁" title={t('section_habits_title')} subtitle={t('section_habits_subtitle')}/>
        {(()=>{
          const groups={};
          habits.forEach(h=>{const c=h.cycle||"—";if(!groups[c])groups[c]=[];groups[c].push(h);});
          const sortedCycles=Object.keys(groups).sort((a,b)=>{const na=parseInt((a.match(/\d+/)||[0])[0],10);const nb=parseInt((b.match(/\d+/)||[0])[0],10);return na-nb;});
          return sortedCycles.map(cycle=>(
            <div key={cycle} style={{marginBottom:28}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                <div style={{height:1,flex:1,background:COLORS.borderGray}}/>
                <span style={{fontSize:12,fontWeight:700,color:COLORS.blue,background:COLORS.lightBlue,border:`1px solid ${COLORS.borderBlue}`,borderRadius:20,padding:"3px 14px",whiteSpace:"nowrap"}}>{t('pdca_cycle',{cycle})}</span>
                <div style={{height:1,flex:1,background:COLORS.borderGray}}/>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                {groups[cycle].map(h=>
                  <Card key={h.id}>
                    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16}}>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={{fontSize:11,color:COLORS.light,fontWeight:600}}>{h.id}</span><span style={{fontWeight:700,color:COLORS.dark,fontSize:14}}>{titleOf(h)}</span></div>
                        <div style={{display:"flex",alignItems:"center",gap:10,fontSize:13}}>
                          <div style={{flex:1,background:COLORS.lightRed,border:`1px solid ${COLORS.borderRed}`,borderRadius:6,padding:"8px 12px"}}><div style={{fontSize:10,fontWeight:700,color:COLORS.red,textTransform:"uppercase",marginBottom:3}}>{t('before')}</div><div style={{color:COLORS.mid}}>{h.old}</div></div>
                          <span style={{color:COLORS.light,fontSize:18}}>→</span>
                          <div style={{flex:1,background:COLORS.lightGreen,border:`1px solid ${COLORS.borderGreen}`,borderRadius:6,padding:"8px 12px"}}><div style={{fontSize:10,fontWeight:700,color:COLORS.green,textTransform:"uppercase",marginBottom:3}}>{t('after')}</div><div style={{color:COLORS.mid}}>{h.new}</div></div>
                        </div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end",minWidth:130}}>
                        <ResultBadge value={h.result}/>
                        <DecisionBadge value={h.decision}/>
                        <Badge text={h.owner} color={COLORS.purple} bg={COLORS.lightPurple} border={COLORS.borderPurple}/>
                      </div>
                    </div>
                  </Card>
                )}
              </div>
            </div>
          ));
        })()}
      </div>}

      {/* ══ AI TASKS ══ */}
      {active==="AI Tasks" && <div>
        <SectionHeader emoji="🤖" title={t('section_ai_tasks_title')} subtitle={t('section_ai_tasks_subtitle')}/>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {aiTasks.map(task=>
            <Card key={task.id}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                <span style={{fontSize:11,color:COLORS.light,fontWeight:600}}>{task.id}</span>
                <span style={{fontWeight:700,color:COLORS.dark,fontSize:14}}>{titleOf(task)}</span>
                <FreqBadge value={task.freq}/>
                {task.capability&&task.capability!=="—"&&<Badge text={tEnum('capability',task.capability)} color={COLORS.purple} bg={COLORS.lightPurple} border={COLORS.borderPurple}/>}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,fontSize:12}}>
                {[{labelKey:'before_ai',val:task.original,c:COLORS.gray,bg:COLORS.lightGray},{labelKey:'ai_contribution',val:task.contribution,c:COLORS.blue,bg:COLORS.lightBlue},{labelKey:'human_role_after_ai',val:task.humanRole,c:COLORS.green,bg:COLORS.lightGreen}].map(col=>
                  <div key={col.labelKey} style={{background:col.bg,borderRadius:6,padding:"10px 12px"}}><div style={{fontSize:10,fontWeight:700,color:col.c,textTransform:"uppercase",marginBottom:4}}>{t(col.labelKey)}</div><div style={{color:COLORS.mid}}>{col.val}</div></div>
                )}
              </div>
            </Card>
          )}
        </div>
      </div>}

      {/* ══ VALUE — HEATMAP ══ */}
      {active==="Value" && <div>
        <SectionHeader emoji="💰" title={t('section_value_title')} subtitle={t('section_value_subtitle')}/>
        <Card style={{marginBottom:20,padding:"12px 20px"}}>
          <div style={{display:"flex",gap:24,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:11,fontWeight:700,color:COLORS.light,textTransform:"uppercase",letterSpacing:0.5}}>{t('niu_score_label')}</span>
            {NIU_COLS.map((col,i)=>(
              <div key={col.labelKey} style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:10,height:10,borderRadius:2,background:SCALE.niu[i].color}}/>
                <span style={{fontSize:12,color:COLORS.dark}}><strong style={{color:SCALE.niu[i].color}}>{col.range}</strong> — {t(col.labelKey)}</span>
              </div>
            ))}
          </div>
        </Card>
        {values.length===0
          ?<Card><div style={{color:COLORS.gray,textAlign:"center",padding:24}}>{t('no_value_data')}</div></Card>
          :<Card><ValueHeatmap values={values}/></Card>
        }
      </div>}

      {/* ══ WASTE-TO-VALUE ══ */}
      {active==="W2V" && (()=>{
        const WASTE_TYPES = [
          { key:"Overhead",    emoji:"⚙️", ...SCALE.waste[0] },
          { key:"Idle Time",   emoji:"⏳", ...SCALE.waste[1] },
          { key:"Rework",      emoji:"🔁", ...SCALE.waste[2] },
          { key:"Scope Creep", emoji:"📐", ...SCALE.waste[3] },
        ];

        const tiles = WASTE_TYPES.map(wt => {
          const wtFrictions = frictions.filter(f => f.wasteType === wt.key);
          const linkedPDCAIds = new Set();
          wtFrictions.forEach(f => f.relatedPDCA.forEach(id => linkedPDCAIds.add(id)));
          const linkedHabits = habits.filter(h => linkedPDCAIds.has(normId(h._id)));
          const linkedAITaskIds = new Set();
          linkedHabits.forEach(h => h.relatedAITask.forEach(id => linkedAITaskIds.add(id)));
          const linkedAITasks = aiTasks.filter(a => linkedAITaskIds.has(normId(a._id)));
          const linkedValueIds = new Set();
          linkedAITasks.forEach(a => a.relatedValue.forEach(id => linkedValueIds.add(id)));
          const linkedValues = values.filter(v => linkedValueIds.has(normId(v._id)));
          const avgNiu = linkedValues.length
            ? Math.round((linkedValues.reduce((s,v) => s+v.niu, 0) / linkedValues.length) * 10) / 10
            : null;
          return { ...wt, wtFrictions, linkedHabits, linkedAITasks, linkedValues, avgNiu };
        });

        return <div>
          <SectionHeader emoji="🔗" title={t('section_w2v_title')} subtitle={t('section_w2v_subtitle')}/>

          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16,marginBottom:28}}>
            {tiles.map(tile => {
              const band = tile.avgNiu!==null ? NIU_LABEL(tile.avgNiu) : {color:COLORS.light,labelKey:'no_data'};
              return (
                <Card key={tile.key} style={{borderTop:`3px solid ${tile.color}`}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                    <span style={{fontSize:18}}>{tile.emoji}</span>
                    <span style={{fontSize:13,fontWeight:700,color:tile.color}}>{tEnum('waste',tile.key)}</span>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:8,fontSize:12}}>
                    {[
                      {k:'frictions_label',    n:tile.wtFrictions.length},
                      {k:'habits_label',       n:tile.linkedHabits.length},
                      {k:'ai_tasks_label',     n:tile.linkedAITasks.length},
                      {k:'value_entries_label',n:tile.linkedValues.length},
                    ].map(row=>(
                      <div key={row.k} style={{display:"flex",justifyContent:"space-between"}}>
                        <span style={{color:COLORS.gray}}>{t(row.k)}</span>
                        <span style={{fontWeight:700,color:COLORS.dark}}>{row.n}</span>
                      </div>
                    ))}
                    <div style={{marginTop:4,paddingTop:8,borderTop:`1px solid ${COLORS.borderGray}`}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                        <span style={{fontSize:11,fontWeight:700,color:COLORS.light,textTransform:"uppercase",letterSpacing:0.3}}>{t('avg_niu_label')}</span>
                        <span style={{fontSize:16,fontWeight:800,color:band.color}}>{tile.avgNiu!==null?`${tile.avgNiu}/8`:"—"}</span>
                      </div>
                      {tile.avgNiu!==null && <NIUBar score={tile.avgNiu}/>}
                      <div style={{fontSize:11,color:band.color,fontWeight:600,marginTop:4}}>{t(band.labelKey)}</div>
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>

          {tiles.map(tile => (
            <Card key={tile.key} style={{marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,paddingBottom:12,borderBottom:`1px solid ${COLORS.borderGray}`}}>
                <span style={{fontSize:16}}>{tile.emoji}</span>
                <span style={{fontSize:14,fontWeight:700,color:tile.color}}>{tEnum('waste',tile.key)}</span>
                <div style={{flex:1}}/>
                {tile.avgNiu!==null && <>
                  <span style={{fontSize:11,color:COLORS.light}}>{t('avg_niu_label')}</span>
                  <span style={{fontSize:14,fontWeight:800,color:NIU_LABEL(tile.avgNiu).color}}>{tile.avgNiu}/8</span>
                </>}
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr auto 1fr auto 1fr",gap:8,alignItems:"start"}}>
                <div>
                  <div style={{fontSize:10,fontWeight:700,color:COLORS.orange,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>{"🔥 " + t('frictions_label') + ` (${tile.wtFrictions.length})`}</div>
                  {tile.wtFrictions.length===0
                    ? <div style={{fontSize:12,color:COLORS.light,fontStyle:"italic"}}>—</div>
                    : tile.wtFrictions.map(f=>(
                        <div key={f.id} style={{fontSize:11,color:COLORS.mid,background:COLORS.lightOrange,border:`1px solid ${COLORS.borderOrange}`,borderRadius:6,padding:"5px 8px",marginBottom:4}}>
                          <span style={{fontWeight:700,color:COLORS.orange}}>{f.id}</span> · {titleOf(f)}
                        </div>
                      ))
                  }
                </div>
                <div style={{color:COLORS.light,fontSize:16,paddingTop:24}}>→</div>

                <div>
                  <div style={{fontSize:10,fontWeight:700,color:COLORS.green,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>{"🔁 " + t('habits_label') + ` (${tile.linkedHabits.length})`}</div>
                  {tile.linkedHabits.length===0
                    ? <div style={{fontSize:12,color:COLORS.light,fontStyle:"italic"}}>—</div>
                    : tile.linkedHabits.map(h=>(
                        <div key={h.id} style={{fontSize:11,color:COLORS.mid,background:COLORS.lightGreen,border:`1px solid ${COLORS.borderGreen}`,borderRadius:6,padding:"5px 8px",marginBottom:4}}>
                          <span style={{fontWeight:700,color:COLORS.green}}>{h.id}</span> · {titleOf(h)}
                        </div>
                      ))
                  }
                </div>
                <div style={{color:COLORS.light,fontSize:16,paddingTop:24}}>→</div>

                <div>
                  <div style={{fontSize:10,fontWeight:700,color:COLORS.blue,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>{"🤖 " + t('ai_tasks_label') + ` (${tile.linkedAITasks.length})`}</div>
                  {tile.linkedAITasks.length===0
                    ? <div style={{fontSize:12,color:COLORS.light,fontStyle:"italic"}}>—</div>
                    : tile.linkedAITasks.map(a=>(
                        <div key={a.id} style={{fontSize:11,color:COLORS.mid,background:COLORS.lightBlue,border:`1px solid ${COLORS.borderBlue}`,borderRadius:6,padding:"5px 8px",marginBottom:4}}>
                          <span style={{fontWeight:700,color:COLORS.blue}}>{a.id}</span> · {titleOf(a)}
                        </div>
                      ))
                  }
                </div>
                <div style={{color:COLORS.light,fontSize:16,paddingTop:24}}>→</div>

                <div>
                  <div style={{fontSize:10,fontWeight:700,color:COLORS.purple,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>{"💰 " + t('value_label') + ` (${tile.linkedValues.length})`}</div>
                  {tile.linkedValues.length===0
                    ? <div style={{fontSize:12,color:COLORS.light,fontStyle:"italic"}}>—</div>
                    : tile.linkedValues.map(v=>{
                        const {color} = NIU_LABEL(v.niu);
                        return (
                          <div key={v.id} style={{fontSize:11,color:COLORS.mid,background:COLORS.lightPurple,border:`1px solid ${COLORS.borderPurple}`,borderRadius:6,padding:"5px 8px",marginBottom:4}}>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                              <span><span style={{fontWeight:700,color:COLORS.purple}}>{v.id}</span> · {titleOf(v)}</span>
                              <span style={{fontWeight:800,color,fontSize:12,marginLeft:8}}>{v.niu}/8</span>
                            </div>
                            <NIUBar score={v.niu}/>
                          </div>
                        );
                      })
                  }
                </div>
              </div>
            </Card>
          ))}
        </div>;
      })()}

      {/* ══ PIPELINE ══ */}
      {active==="Pipeline" && <div>
        <SectionHeader emoji="🔮" title={t('section_pipeline_title')} subtitle={t('section_pipeline_subtitle')}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:COLORS.mid,marginBottom:12,textTransform:"uppercase",letterSpacing:0.5}}>{t('pipeline_value_pending')}</div>
            {values.filter(v=>v.sponsor!=="Validated").map(v=>
              <Card key={v.id} style={{marginBottom:10}}>
                <div style={{fontWeight:700,color:COLORS.dark,fontSize:13,marginBottom:6}}>{titleOf(v)}</div>
                <div style={{fontSize:12,color:COLORS.gray,marginBottom:8}}>{v.estimate}</div>
                <NIUBar score={v.niu}/>
                <div style={{marginTop:6,display:"flex",gap:6,flexWrap:"wrap"}}>
                  <Badge text={tEnum('valueType',v.type)} color={COLORS.blue} bg={COLORS.lightBlue} border={COLORS.borderBlue}/>
                  <Badge text={t('confidence_prefix',{level:tEnum('confidence',v.confidence)})} color={v.confidence==="High"?COLORS.green:v.confidence==="Medium"?COLORS.yellow:COLORS.red} bg={v.confidence==="High"?COLORS.lightGreen:v.confidence==="Medium"?COLORS.lightYellow:COLORS.lightRed} border={COLORS.borderGray}/>
                  <SponsorBadge value={v.sponsor}/>
                </div>
              </Card>
            )}
          </div>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:COLORS.mid,marginBottom:12,textTransform:"uppercase",letterSpacing:0.5}}>{t('pipeline_pdca_progress')}</div>
            {habits.filter(h=>h.result==="Pending"||h.result==="Partial").map(h=>
              <Card key={h.id} style={{marginBottom:10}}>
                <div style={{fontWeight:700,color:COLORS.dark,fontSize:13,marginBottom:6}}>{titleOf(h)}</div>
                <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
                  <ResultBadge value={h.result}/>
                  <Badge text={h.cycle} color={COLORS.blue} bg={COLORS.lightBlue} border={COLORS.borderBlue}/>
                  <Badge text={h.owner} color={COLORS.purple} bg={COLORS.lightPurple} border={COLORS.borderPurple}/>
                </div>
                <div style={{fontSize:12,color:COLORS.gray}}><span style={{color:COLORS.light}}>{t('before_prefix')}</span>{h.old} → <strong style={{color:COLORS.green}}>{h.new}</strong></div>
              </Card>
            )}
          </div>
        </div>
      </div>}

    </div>
  </div>;
}

// ══════════════════════════════════════════════════════════════
// App — détient la langue, fournit le contexte
// ══════════════════════════════════════════════════════════════
function App() {
  const [lang, setLangState] = React.useState(() => {
    try { const s = localStorage.getItem('nyll_lang'); if (s && window.TRANSLATIONS[s]) return s; } catch(e) {}
    return window.CURRENT_LANG || window.I18N_DEFAULT_LANG || 'fr';
  });
  const [theme, setThemeState] = React.useState(THEME_INIT);

  const i18n = React.useMemo(() => makeI18n(lang), [lang]);
  const setLang = React.useCallback(l => { window.CURRENT_LANG = l; setLangState(l); }, []);
  const setTheme = React.useCallback(tn => { applyTheme(tn); setThemeState(tn); }, []);

  React.useEffect(() => {
    window.CURRENT_LANG = lang;
    try { localStorage.setItem('nyll_lang', lang); } catch(e) {}
    document.documentElement.lang = lang;
    document.title = i18n.t('page_title');
  }, [lang, i18n]);

  React.useEffect(() => {
    document.documentElement.style.background = COLORS.pageBg;
    try { localStorage.setItem('nyll_theme', theme); } catch(e) {}
  }, [theme]);

  const ctx = React.useMemo(() => ({...i18n, setLang, theme, setTheme}), [i18n, setLang, theme, setTheme]);
  return <I18nCtx.Provider value={ctx}><Dashboard/></I18nCtx.Provider>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
